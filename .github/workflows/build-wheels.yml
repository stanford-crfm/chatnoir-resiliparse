name: Build & Upload Wheels

on:
  push:
    tags: 
      - "v*.*.*"
  workflow_dispatch:  # Allow manual trigger

env:
  PYTHON_VERSION: "3.10"
  MACOSX_DEPLOYMENT_TARGET: "12.0"

jobs:
  # First build resiliparse_dom as fastwarc depends on it
  build-resiliparse-dom:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # Setup QEMU for Linux builds
      - name: Set up QEMU
        if: runner.os == 'Linux'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all

      # Cache Vcpkg for macOS and Windows
      - name: Cache Vcpkg
        uses: actions/cache@v4
        id: cache-vcpkg
        if: runner.os == 'macOS' || runner.os == 'Windows'
        with:
          path: ./vcpkg_installed
          key: ${{ runner.os }}-vcpkg-1

      # Install dependencies for macOS and Windows
      - name: Install Vcpkg Dependencies
        if: (runner.os == 'macOS' || runner.os == 'Windows') && steps.cache-vcpkg.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -xe

          # Windows
          if [ -d /c/vcpkg ]; then
            git clone https://github.com/Microsoft/vcpkg C:/vcpkg
            C:/vcpkg/bootstrap-vcpkg.bat
            C:/vcpkg/vcpkg install lz4:x64-windows re2:x64-windows abseil:x64-windows zlib:x64-windows

          # MacOS
          elif [ "$(uname -s)" == "Darwin" ]; then
            brew install lz4 re2 abseil zlib uchardet
            
            # Install lexbor from source
            git clone https://github.com/lexbor/lexbor.git
            cd lexbor
            mkdir build && cd build
            cmake -DCMAKE_BUILD_TYPE=Release -DLEXBOR_BUILD_SHARED=ON -DLEXBOR_BUILD_STATIC=ON ..
            make
            sudo make install
          fi

      - name: Install cibuildwheel
        run: python -m pip install cibuildwheel

      - name: Build wheels
        run: python -m cibuildwheel --output-dir wheelhouse
        working-directory: ./resiliparse_dom
        env:
          # Skip musllinux and use only specific Python versions
          CIBW_SKIP: "*-musllinux*"
          CIBW_BUILD: "cp3*"
          
          # Set architecture
          CIBW_ARCHS_MACOS: "x86_64 arm64"
          CIBW_ARCHS_LINUX: "x86_64"
          
          # Use the project's custom container for Linux builds
          CIBW_MANYLINUX_X86_64_IMAGE: ghcr.io/chatnoir-eu/resiliparse-manylinux_2_28_x86_64:latest
          
          # MacOS repair command
          CIBW_REPAIR_WHEEL_COMMAND_MACOS: >-
            DYLD_LIBRARY_PATH=$(pwd)/vcpkg_installed/$(echo {delocate_archs} | sed s/x86_64/x64/)-osx/lib
            delocate-wheel --require-archs {delocate_archs} -w {dest_dir} {wheel}
            
          # Windows build and repair setup
          CIBW_BEFORE_BUILD_WINDOWS: "python -m pip install delvewheel"
          CIBW_REPAIR_WHEEL_COMMAND_WINDOWS: >-
            delvewheel repair --add-path vcpkg_installed\x64-windows\bin -w {dest_dir} {wheel}

      - uses: actions/upload-artifact@v4
        with:
          name: resiliparse-dom-wheels-${{ matrix.os }}
          path: resiliparse_dom/wheelhouse/*.whl

  # Then build fastwarc with resiliparse_inc headers available
  build-fastwarc:
    needs: build-resiliparse-dom
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # Setup QEMU for Linux builds
      - name: Set up QEMU
        if: runner.os == 'Linux'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all

      # Cache Vcpkg for macOS and Windows
      - name: Cache Vcpkg
        uses: actions/cache@v4
        id: cache-vcpkg
        if: runner.os == 'macOS' || runner.os == 'Windows'
        with:
          path: ./vcpkg_installed
          key: ${{ runner.os }}-vcpkg-1

      # Install dependencies for macOS and Windows
      - name: Install Vcpkg Dependencies
        if: (runner.os == 'macOS' || runner.os == 'Windows') && steps.cache-vcpkg.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -xe

          # Windows
          if [ -d /c/vcpkg ]; then
            git clone https://github.com/Microsoft/vcpkg C:/vcpkg
            C:/vcpkg/bootstrap-vcpkg.bat
            C:/vcpkg/vcpkg install lz4:x64-windows re2:x64-windows abseil:x64-windows zlib:x64-windows

          # MacOS
          elif [ "$(uname -s)" == "Darwin" ]; then
            brew install lz4 re2 abseil zlib uchardet
            
            # Install lexbor from source
            git clone https://github.com/lexbor/lexbor.git
            cd lexbor
            mkdir build && cd build
            cmake -DCMAKE_BUILD_TYPE=Release -DLEXBOR_BUILD_SHARED=ON -DLEXBOR_BUILD_STATIC=ON ..
            make
            sudo make install
          fi

      # Setup resiliparse_inc header files for fastwarc build
      - name: Setup resiliparse headers
        run: |
          # Copy resiliparse_inc directory to fastwarc
          mkdir -p fastwarc/resiliparse_inc
          cp -r resiliparse_dom/resiliparse_inc/* fastwarc/resiliparse_inc/ || echo "Failed to copy headers"
          find resiliparse_dom -name "resiliparse_inc" -type d
        shell: bash

      - name: Install cibuildwheel
        run: python -m pip install cibuildwheel

      - name: Download resiliparse_dom wheels
        uses: actions/download-artifact@v4
        with:
          name: resiliparse-dom-wheels-${{ matrix.os }}
          path: ./resiliparse_dom_wheels

      - name: Build wheels
        run: python -m cibuildwheel --output-dir wheelhouse
        working-directory: ./fastwarc
        env:
          # Skip musllinux and use only specific Python versions
          CIBW_SKIP: "*-musllinux*"
          CIBW_BUILD: "cp3*"
          
          # Set architecture
          CIBW_ARCHS_MACOS: "x86_64 arm64"
          CIBW_ARCHS_LINUX: "x86_64"
          
          # Use the project's custom container for Linux builds
          CIBW_MANYLINUX_X86_64_IMAGE: ghcr.io/chatnoir-eu/resiliparse-manylinux_2_28_x86_64:latest
          
          # Setup container to have access to resiliparse_inc headers
          CIBW_ENVIRONMENT: "RESILIPARSE_ROOT=/project"
          
          # MacOS repair command
          CIBW_REPAIR_WHEEL_COMMAND_MACOS: >-
            DYLD_LIBRARY_PATH=$(pwd)/vcpkg_installed/$(echo {delocate_archs} | sed s/x86_64/x64/)-osx/lib
            delocate-wheel --require-archs {delocate_archs} -w {dest_dir} {wheel}
            
          # Windows build and repair setup
          CIBW_BEFORE_BUILD_WINDOWS: "python -m pip install delvewheel"
          CIBW_REPAIR_WHEEL_COMMAND_WINDOWS: >-
            delvewheel repair --add-path vcpkg_installed\x64-windows\bin -w {dest_dir} {wheel}

      - uses: actions/upload-artifact@v4
        with:
          name: fastwarc-wheels-${{ matrix.os }}
          path: fastwarc/wheelhouse/*.whl

  release:
    needs: [build-fastwarc, build-resiliparse-dom]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    
    permissions:
      contents: write  # Required for creating GitHub releases
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Display structure of downloaded artifacts
        run: find dist -type f | sort

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/**/*.whl
          draft: false
          generate_release_notes: true
