name: Build & Upload Wheels

on:
  push:
    tags: 
      - "v*.*.*"
  workflow_dispatch:  # Allow manual trigger

jobs:
  build-fastwarc:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # Install system dependencies for Linux
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y liblz4-dev

      # Install dependencies for macOS
      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew install lz4

      # Install dependencies for Windows
      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        run: |
          # Use vcpkg to install lz4
          git clone https://github.com/microsoft/vcpkg.git C:\vcpkg
          C:\vcpkg\bootstrap-vcpkg.bat
          C:\vcpkg\vcpkg install lz4:x64-windows

      - name: Install cibuildwheel
        run: python -m pip install cibuildwheel

      - name: Build wheels
        run: python -m cibuildwheel --output-dir wheelhouse
        working-directory: ./fastwarc
        env:
          CIBW_BUILD: "cp3*"
          CIBW_ARCHS: "auto64"
          # For Linux, install dependencies in the manylinux containers
          CIBW_BEFORE_ALL_LINUX: "yum install -y lz4-devel || (yum install -y epel-release && yum install -y lz4-devel) || (apt-get update && apt-get install -y liblz4-dev)"
          # For Windows, set the path to vcpkg include and lib directories
          CIBW_ENVIRONMENT_WINDOWS: "INCLUDE=C:\\vcpkg\\installed\\x64-windows\\include;$INCLUDE LIB=C:\\vcpkg\\installed\\x64-windows\\lib;$LIB"

      - uses: actions/upload-artifact@v4
        with:
          name: fastwarc-wheels-${{ matrix.os }}
          path: fastwarc/wheelhouse/*.whl

  build-resiliparse-dom:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # Install system dependencies for Linux
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y liblz4-dev

      # Install dependencies for macOS
      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew install lz4

      # Install dependencies for Windows
      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        run: |
          # Use vcpkg to install lz4
          git clone https://github.com/microsoft/vcpkg.git C:\vcpkg
          C:\vcpkg\bootstrap-vcpkg.bat
          C:\vcpkg\vcpkg install lz4:x64-windows

      - name: Install cibuildwheel
        run: python -m pip install cibuildwheel

      - name: Build wheels
        run: python -m cibuildwheel --output-dir wheelhouse
        working-directory: ./resiliparse_dom
        env:
          CIBW_BUILD: "cp3*"
          CIBW_ARCHS: "auto64"
          # For Linux, install dependencies in the manylinux containers
          CIBW_BEFORE_ALL_LINUX: "yum install -y lz4-devel || (yum install -y epel-release && yum install -y lz4-devel) || (apt-get update && apt-get install -y liblz4-dev)"
          # For Windows, set the path to vcpkg include and lib directories
          CIBW_ENVIRONMENT_WINDOWS: "INCLUDE=C:\\vcpkg\\installed\\x64-windows\\include;$INCLUDE LIB=C:\\vcpkg\\installed\\x64-windows\\lib;$LIB"

      - uses: actions/upload-artifact@v4
        with:
          name: resiliparse-dom-wheels-${{ matrix.os }}
          path: resiliparse_dom/wheelhouse/*.whl

  release:
    needs: [build-fastwarc, build-resiliparse-dom]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    
    permissions:
      contents: write  # Required for creating GitHub releases
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Display structure of downloaded artifacts
        run: find dist -type f | sort

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/**/*.whl
          draft: false
          generate_release_notes: true
