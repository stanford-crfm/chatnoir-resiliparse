name: Build & Upload Wheels

on:
  push:
    tags: 
      - "v*.*.*"
  workflow_dispatch:  # Allow manual trigger

jobs:
  # First build resiliparse_dom as fastwarc depends on it
  build-resiliparse-dom:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # Install system dependencies for Linux
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y liblz4-dev zlib1g-dev
          
          # Install lexbor from source (since it's not in default repos)
          git clone https://github.com/lexbor/lexbor.git
          cd lexbor
          mkdir build && cd build
          cmake -DCMAKE_BUILD_TYPE=Release -DLEXBOR_BUILD_SHARED=ON -DLEXBOR_BUILD_STATIC=ON ..
          make
          sudo make install
          sudo ldconfig
          cd ../..
          
          # Install Google RE2
          git clone https://github.com/google/re2.git
          cd re2
          make
          sudo make install
          sudo ldconfig
          cd ..
          
          # Install abseil-cpp
          git clone https://github.com/abseil/abseil-cpp.git
          cd abseil-cpp
          mkdir build && cd build
          cmake -DCMAKE_POSITION_INDEPENDENT_CODE=ON -DCMAKE_CXX_STANDARD=17 ..
          make
          sudo make install
          sudo ldconfig
          cd ../..
          
          # Install uchardet
          git clone https://gitlab.freedesktop.org/uchardet/uchardet.git
          cd uchardet
          mkdir build && cd build
          cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_STANDARD=17 ..
          make
          sudo make install
          sudo ldconfig

      # Install dependencies for macOS
      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew install lz4 re2 abseil zlib
          
          # Install lexbor from source
          git clone https://github.com/lexbor/lexbor.git
          cd lexbor
          mkdir build && cd build
          cmake -DCMAKE_BUILD_TYPE=Release -DLEXBOR_BUILD_SHARED=ON -DLEXBOR_BUILD_STATIC=ON ..
          make
          sudo make install
          cd ../..
          
          # Install uchardet
          brew install uchardet

      # Install dependencies for Windows
      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        run: |
          # Use vcpkg to install dependencies
          git clone https://github.com/microsoft/vcpkg.git C:\vcpkg
          C:\vcpkg\bootstrap-vcpkg.bat
          C:\vcpkg\vcpkg install lz4:x64-windows re2:x64-windows abseil:x64-windows zlib:x64-windows
          
          # Build and install lexbor
          git clone https://github.com/lexbor/lexbor.git C:\lexbor
          cd C:\lexbor
          mkdir build
          cd build
          cmake -DCMAKE_BUILD_TYPE=Release -DLEXBOR_BUILD_SHARED=ON -DLEXBOR_BUILD_STATIC=ON ..
          cmake --build . --config Release
          cmake --install . --config Release
          
          # Install uchardet
          git clone https://gitlab.freedesktop.org/uchardet/uchardet.git C:\uchardet
          cd C:\uchardet
          mkdir build
          cd build
          cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_STANDARD=17 ..
          cmake --build . --config Release
          cmake --install . --config Release

      - name: Install cibuildwheel
        run: python -m pip install cibuildwheel

      - name: Build wheels
        run: python -m cibuildwheel --output-dir wheelhouse
        working-directory: ./resiliparse_dom
        env:
          CIBW_BUILD: "cp3*"
          CIBW_ARCHS: "auto64"
          # For Linux, install dependencies in the manylinux containers
          CIBW_BEFORE_ALL_LINUX: |
            yum install -y lz4-devel zlib-devel || (yum install -y epel-release && yum install -y lz4-devel zlib-devel) || (apt-get update && apt-get install -y liblz4-dev zlib1g-dev)
            # Install cmake for building dependencies
            yum install -y cmake3 || yum install -y cmake || apt-get install -y cmake
            
            # Install lexbor
            git clone https://github.com/lexbor/lexbor.git
            cd lexbor
            mkdir build && cd build
            cmake -DCMAKE_BUILD_TYPE=Release -DLEXBOR_BUILD_SHARED=ON -DLEXBOR_BUILD_STATIC=ON ..
            make
            make install
            ldconfig
            cd ../..
            
            # Install Google RE2
            git clone --branch 2024-04-01 https://github.com/google/re2.git
            cd re2
            make
            make install
            ldconfig
            cd ..
            
            # Install abseil-cpp
            git clone --branch 20240116.1 https://github.com/abseil/abseil-cpp.git
            cd abseil-cpp
            mkdir build && cd build
            cmake -DCMAKE_POSITION_INDEPENDENT_CODE=ON -DCMAKE_CXX_STANDARD=17 ..
            make
            make install
            ldconfig
            cd ../..
            
            # Install uchardet
            git clone https://gitlab.freedesktop.org/uchardet/uchardet.git
            cd uchardet
            mkdir build && cd build
            cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_STANDARD=17 ..
            make
            make install
            ldconfig
          # For Windows, set the path to vcpkg include and lib directories
          CIBW_ENVIRONMENT_WINDOWS: "INCLUDE=C:\\lexbor\\include;C:\\uchardet\\include;C:\\vcpkg\\installed\\x64-windows\\include;$INCLUDE LIB=C:\\lexbor\\lib;C:\\uchardet\\lib;C:\\vcpkg\\installed\\x64-windows\\lib;$LIB"
          CIBW_ENVIRONMENT_MACOS: "CPATH=/usr/local/include:$CPATH LIBRARY_PATH=/usr/local/lib:$LIBRARY_PATH"

      - uses: actions/upload-artifact@v4
        with:
          name: resiliparse-dom-wheels-${{ matrix.os }}
          path: resiliparse_dom/wheelhouse/*.whl

  # Then build fastwarc with resiliparse_inc headers available
  build-fastwarc:
    needs: build-resiliparse-dom
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # Install system dependencies for Linux
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y liblz4-dev zlib1g-dev
          
          # Install lexbor from source (since it's not in default repos)
          git clone https://github.com/lexbor/lexbor.git
          cd lexbor
          mkdir build && cd build
          cmake -DCMAKE_BUILD_TYPE=Release -DLEXBOR_BUILD_SHARED=ON -DLEXBOR_BUILD_STATIC=ON ..
          make
          sudo make install
          sudo ldconfig
          cd ../..
          
          # Install Google RE2
          git clone https://github.com/google/re2.git
          cd re2
          make
          sudo make install
          sudo ldconfig
          cd ..
          
          # Install abseil-cpp
          git clone https://github.com/abseil/abseil-cpp.git
          cd abseil-cpp
          mkdir build && cd build
          cmake -DCMAKE_POSITION_INDEPENDENT_CODE=ON -DCMAKE_CXX_STANDARD=17 ..
          make
          sudo make install
          sudo ldconfig
          cd ../..
          
          # Install uchardet
          git clone https://gitlab.freedesktop.org/uchardet/uchardet.git
          cd uchardet
          mkdir build && cd build
          cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_STANDARD=17 ..
          make
          sudo make install
          sudo ldconfig

      # Install dependencies for macOS
      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew install lz4 re2 abseil zlib
          
          # Install lexbor from source
          git clone https://github.com/lexbor/lexbor.git
          cd lexbor
          mkdir build && cd build
          cmake -DCMAKE_BUILD_TYPE=Release -DLEXBOR_BUILD_SHARED=ON -DLEXBOR_BUILD_STATIC=ON ..
          make
          sudo make install
          cd ../..
          
          # Install uchardet
          brew install uchardet

      # Install dependencies for Windows
      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        run: |
          # Use vcpkg to install dependencies
          git clone https://github.com/microsoft/vcpkg.git C:\vcpkg
          C:\vcpkg\bootstrap-vcpkg.bat
          C:\vcpkg\vcpkg install lz4:x64-windows re2:x64-windows abseil:x64-windows zlib:x64-windows
          
          # Build and install lexbor
          git clone https://github.com/lexbor/lexbor.git C:\lexbor
          cd C:\lexbor
          mkdir build
          cd build
          cmake -DCMAKE_BUILD_TYPE=Release -DLEXBOR_BUILD_SHARED=ON -DLEXBOR_BUILD_STATIC=ON ..
          cmake --build . --config Release
          cmake --install . --config Release
          
          # Install uchardet
          git clone https://gitlab.freedesktop.org/uchardet/uchardet.git C:\uchardet
          cd C:\uchardet
          mkdir build
          cd build
          cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_STANDARD=17 ..
          cmake --build . --config Release
          cmake --install . --config Release

      # Setup resiliparse_inc header files for fastwarc build
      - name: Setup resiliparse headers
        run: |
          # Copy resiliparse_inc directory to fastwarc
          mkdir -p fastwarc/resiliparse_inc
          cp -r resiliparse_dom/resiliparse_inc/* fastwarc/resiliparse_inc/
        shell: bash

      - name: Install cibuildwheel
        run: python -m pip install cibuildwheel

      - name: Build wheels
        run: python -m cibuildwheel --output-dir wheelhouse
        working-directory: ./fastwarc
        env:
          CIBW_BUILD: "cp3*"
          CIBW_ARCHS: "auto64"
          # For Linux, install dependencies in the manylinux containers
          CIBW_BEFORE_ALL_LINUX: |
            yum install -y lz4-devel zlib-devel || (yum install -y epel-release && yum install -y lz4-devel zlib-devel) || (apt-get update && apt-get install -y liblz4-dev zlib1g-dev)
            # Install cmake for building dependencies
            yum install -y cmake3 || yum install -y cmake || apt-get install -y cmake
            
            # Install lexbor
            git clone https://github.com/lexbor/lexbor.git
            cd lexbor
            mkdir build && cd build
            cmake -DCMAKE_BUILD_TYPE=Release -DLEXBOR_BUILD_SHARED=ON -DLEXBOR_BUILD_STATIC=ON ..
            make
            make install
            ldconfig
            cd ../..
            
            # Install Google RE2
            git clone --branch 2024-04-01 https://github.com/google/re2.git
            cd re2
            make
            make install
            ldconfig
            cd ..
            
            # Install abseil-cpp
            git clone --branch 20240116.1 https://github.com/abseil/abseil-cpp.git
            cd abseil-cpp
            mkdir build && cd build
            cmake -DCMAKE_POSITION_INDEPENDENT_CODE=ON -DCMAKE_CXX_STANDARD=17 ..
            make
            make install
            ldconfig
            cd ../..
            
            # Install uchardet
            git clone https://gitlab.freedesktop.org/uchardet/uchardet.git
            cd uchardet
            mkdir build && cd build
            cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_STANDARD=17 ..
            make
            make install
            ldconfig
            
            # Copy resiliparse_inc headers into the container
            mkdir -p /project/resiliparse_inc
            cp -r /host/project/resiliparse_inc/* /project/resiliparse_inc/ || echo "Failed to copy headers, checking path" && ls -la /host/
          # For Windows, set the path to vcpkg include and lib directories
          CIBW_ENVIRONMENT_WINDOWS: "INCLUDE=C:\\lexbor\\include;C:\\uchardet\\include;C:\\vcpkg\\installed\\x64-windows\\include;$INCLUDE LIB=C:\\lexbor\\lib;C:\\uchardet\\lib;C:\\vcpkg\\installed\\x64-windows\\lib;$LIB"
          CIBW_ENVIRONMENT_MACOS: "CPATH=/usr/local/include:$CPATH LIBRARY_PATH=/usr/local/lib:$LIBRARY_PATH"

      - uses: actions/upload-artifact@v4
        with:
          name: fastwarc-wheels-${{ matrix.os }}
          path: fastwarc/wheelhouse/*.whl

  release:
    needs: [build-fastwarc, build-resiliparse-dom]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    
    permissions:
      contents: write  # Required for creating GitHub releases
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Display structure of downloaded artifacts
        run: find dist -type f | sort

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/**/*.whl
          draft: false
          generate_release_notes: true
