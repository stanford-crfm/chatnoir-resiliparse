name: Build & Upload Wheels

on:
  push:
    tags: 
      - "v*.*.*"
  workflow_dispatch:  # Allow manual trigger

env:
  PYTHON_VERSION: "3.10"
  MACOSX_DEPLOYMENT_TARGET: "12.0"
  ABSEIL_VERSION: "20240116.1"
  RE2_VERSION: "2024-04-01"

jobs:
  # First build resiliparse_dom as fastwarc depends on it
  build-resiliparse-dom:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # Setup QEMU for Linux builds with non-x86_64 architecture
      - name: Set up QEMU
        if: runner.os == 'Linux'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      # Cache Vcpkg for Windows and macOS
      - name: Cache vcpkg
        if: runner.os == 'Windows'
        uses: actions/cache@v3
        with:
          path: C:/vcpkg
          key: ${{ runner.os }}-vcpkg-${{ hashFiles('**/vcpkg.json') }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-

      # Build custom Docker container for Linux with our exact requirements
      - name: Build custom manylinux Docker container
        if: runner.os == 'Linux'
        run: |
          docker build -t manylinux-resiliparse:latest --build-arg TARGET_ARCH=x86_64 .
        
      # Install system dependencies for macOS
      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew install lz4 zlib pkg-config
          
          # Find and export LZ4 locations
          export LZ4_INCLUDE=$(brew --prefix lz4)/include
          export LZ4_LIB=$(brew --prefix lz4)/lib
          echo "LZ4 include path: $LZ4_INCLUDE"
          echo "LZ4 library path: $LZ4_LIB"
          
          # List the contents of the LZ4 include directory
          echo "LZ4 include directory contents:"
          ls -la $LZ4_INCLUDE
          
          # Create a local directory for LZ4 headers in the user's home directory
          mkdir -p $HOME/lz4_include
          cp $(brew --prefix lz4)/include/lz4*.h $HOME/lz4_include/
          
          # Explicitly install specific version of Abseil
          git clone https://github.com/abseil/abseil-cpp.git --branch ${{ env.ABSEIL_VERSION }}
          cd abseil-cpp
          mkdir build && cd build
          cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr/local -DCMAKE_POSITION_INDEPENDENT_CODE=ON -DCMAKE_CXX_STANDARD=17 -DBUILD_SHARED_LIBS=OFF ..
          make
          sudo make install
          cd ../..
          
          # Install specific version of RE2
          git clone https://github.com/google/re2.git
          cd re2
          git checkout ${{ env.RE2_VERSION }}
          mkdir build && cd build
          cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr/local -DCMAKE_POSITION_INDEPENDENT_CODE=ON -DCMAKE_CXX_STANDARD=17 -DBUILD_SHARED_LIBS=ON -DRE2_BUILD_TESTING=OFF ..
          make
          sudo make install
          cd ../..
          
          # Install lexbor from source
          git clone https://github.com/lexbor/lexbor.git
          cd lexbor
          mkdir build && cd build
          cmake -DCMAKE_BUILD_TYPE=Release -DLEXBOR_BUILD_SHARED=ON -DLEXBOR_BUILD_STATIC=ON ..
          make
          sudo make install
          cd ../..
          
          # Apply lexbor API compatibility patch for html.pyx
          cat > lexbor_api_patch.sed << 'EOF'
          s/lxb_selectors_t/lxb_css_selectors_t/g
          s/lxb_selectors_create/lxb_css_selectors_create/g
          s/lxb_selectors_init/lxb_css_selectors_init/g
          s/lxb_selectors_destroy/lxb_css_selectors_destroy/g
          s/lxb_selectors_find/lxb_css_selectors_find/g
          s/lxb_selectors_cb_f/lxb_css_selectors_cb_f/g
          EOF
          
          # Apply the patch to the source files
          echo "Applying lexbor API compatibility patch"
          sed -i.bak -f lexbor_api_patch.sed resiliparse_dom/resiliparse_dom/parse/html.pyx
          sed -i.bak -f lexbor_api_patch.sed resiliparse_dom/resiliparse_inc/lexbor.pxd
          
          # Install uchardet
          brew install uchardet
          
          # Create LZ4 directories with sudo and copy headers
          sudo mkdir -p /usr/local/include/lz4
          # Copy LZ4 headers to both locations
          sudo cp -f $(brew --prefix lz4)/include/lz4*.h /usr/local/include/
          sudo cp -f $(brew --prefix lz4)/include/lz4*.h /usr/local/include/lz4/
          
          # Set environment variables for this job
          echo "CPATH=$HOME/lz4_include:$(brew --prefix lz4)/include:$(brew --prefix)/include:/usr/local/include:$CPATH" >> $GITHUB_ENV
          echo "LIBRARY_PATH=$(brew --prefix lz4)/lib:$(brew --prefix)/lib:/usr/local/lib:$LIBRARY_PATH" >> $GITHUB_ENV
          echo "PKG_CONFIG_PATH=$(brew --prefix lz4)/lib/pkgconfig:$(brew --prefix)/lib/pkgconfig:$PKG_CONFIG_PATH" >> $GITHUB_ENV
          echo "LZ4_PREFIX=$(brew --prefix lz4)" >> $GITHUB_ENV

      # Install dependencies for Windows
      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        run: |
          # Use vcpkg to install dependencies including uchardet
          git clone https://github.com/microsoft/vcpkg.git C:\vcpkg
          C:\vcpkg\bootstrap-vcpkg.bat
          C:\vcpkg\vcpkg install lz4:x64-windows zlib:x64-windows uchardet:x64-windows
          
          # Install abseil with correct version
          git clone https://github.com/abseil/abseil-cpp.git C:\abseil --branch ${{ env.ABSEIL_VERSION }}
          cd C:\abseil
          mkdir build
          cd build
          cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=C:\abseil\install -DCMAKE_POSITION_INDEPENDENT_CODE=ON -DCMAKE_CXX_STANDARD=17 -DBUILD_SHARED_LIBS=OFF ..
          cmake --build . --config Release
          cmake --install . --config Release
          
          # Install RE2 with correct version
          git clone https://github.com/google/re2.git C:\re2
          cd C:\re2
          git checkout ${{ env.RE2_VERSION }}
          mkdir build
          cd build
          cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=C:\re2\install -DCMAKE_POSITION_INDEPENDENT_CODE=ON -DCMAKE_CXX_STANDARD=17 -DBUILD_SHARED_LIBS=ON -DRE2_BUILD_TESTING=OFF ..
          cmake --build . --config Release
          cmake --install . --config Release
          
          # Build and install lexbor
          git clone https://github.com/lexbor/lexbor.git C:\lexbor
          cd C:\lexbor
          mkdir build
          cd build
          cmake -DCMAKE_BUILD_TYPE=Release -DLEXBOR_BUILD_SHARED=ON -DLEXBOR_BUILD_STATIC=ON ..
          cmake --build . --config Release
          cmake --install . --config Release
          
          # Make sure the include and library paths are accessible
          echo "Include paths:"
          dir C:\vcpkg\installed\x64-windows\include
          echo "Library paths:"
          dir C:\vcpkg\installed\x64-windows\lib
          echo "Bin paths:"
          dir C:\vcpkg\installed\x64-windows\bin

      - name: Install cibuildwheel
        run: python -m pip install cibuildwheel

      - name: Build Linux wheels
        if: runner.os == 'Linux'
        run: |
          # Debug information about the Docker image
          docker run --rm manylinux-resiliparse:latest find /usr -name "re2.h" || echo "re2.h not found"
          docker run --rm manylinux-resiliparse:latest find /usr -name "libabsl*" || echo "libabsl not found"
          docker run --rm manylinux-resiliparse:latest find /usr -name "liblexbor*" || echo "liblexbor not found"
          
          # Run cibuildwheel with additional debugging environment
          CIBW_ENVIRONMENT_LINUX="CPATH=/usr/include:/usr/local/include:${CPATH} LIBRARY_PATH=/usr/lib64:/usr/lib:/usr/local/lib64:/usr/local/lib:${LIBRARY_PATH} PKG_CONFIG_PATH=/usr/lib64/pkgconfig:/usr/lib/pkgconfig:/usr/local/lib64/pkgconfig:/usr/local/lib/pkgconfig:${PKG_CONFIG_PATH} PYTHONDONTWRITEBYTECODE=1" \
          python -m cibuildwheel --output-dir wheelhouse
        working-directory: ./resiliparse_dom
        env:
          CIBW_BUILD: "cp3*"
          CIBW_ARCHS_LINUX: "x86_64"
          # Use the custom Docker container we built
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux-resiliparse:latest
          CIBW_BEFORE_ALL_LINUX: |
            # Make sure the linker can find all libraries
            ldconfig
            # Show available libraries
            echo "Installed libraries:"
            ldconfig -p | grep -E 're2|absl|lexbor|uchardet|lz4'
            
            # Create debug links in case paths are incorrect
            mkdir -p /usr/include/re2
            find /usr -name "re2.h" -exec cp -f {} /usr/include/re2/ \;
            
            # Debug information to check paths
            echo "Path environment:"
            echo "CPATH=$CPATH"
            echo "LIBRARY_PATH=$LIBRARY_PATH"
            echo "Contents of /usr/include directory:"
            ls -la /usr/include
            echo "Contents of /usr/local/include directory:"
            ls -la /usr/local/include 2>/dev/null || echo "Directory not found"

      - name: Build macOS wheels
        if: runner.os == 'macOS'
        run: |
          pip install delocate
          
          # Print environment for debugging
          echo "CPATH: $CPATH"
          echo "LIBRARY_PATH: $LIBRARY_PATH"
          echo "PKG_CONFIG_PATH: $PKG_CONFIG_PATH"
          echo "LZ4_PREFIX: $LZ4_PREFIX"
          
          # Find LZ4 installation
          echo "LZ4 include directory contents:"
          ls -la "$LZ4_PREFIX/include"
          echo "LZ4 lib directory contents:"
          ls -la "$LZ4_PREFIX/lib"
          echo "Home directory LZ4 include contents:"
          ls -la "$HOME/lz4_include"
          
          # Print the contents of /usr/local/include to verify our headers
          echo "Contents of /usr/local/include:"
          ls -la /usr/local/include | grep lz4
          echo "Contents of /usr/local/include/lz4:"
          ls -la /usr/local/include/lz4 || echo "Directory not found"
          
          python -m cibuildwheel --output-dir wheelhouse
        working-directory: ./resiliparse_dom
        env:
          CIBW_BUILD: "cp3*"
          CIBW_ARCHS_MACOS: "x86_64 arm64"
          CIBW_ENVIRONMENT_MACOS: >-
            CPATH=$HOME/lz4_include:$LZ4_PREFIX/include:/usr/local/include:$CPATH
            LIBRARY_PATH=$LZ4_PREFIX/lib:/usr/local/lib:$LIBRARY_PATH
            PKG_CONFIG_PATH=$LZ4_PREFIX/lib/pkgconfig:$PKG_CONFIG_PATH
            MACOSX_DEPLOYMENT_TARGET=${{ env.MACOSX_DEPLOYMENT_TARGET }}
            LZ4_PREFIX=$LZ4_PREFIX
            HOME=$HOME
          CIBW_BEFORE_BUILD_MACOS: >-
            brew install pkg-config &&
            mkdir -p $HOME/lz4_include_cibw &&
            cp -f $LZ4_PREFIX/include/lz4*.h $HOME/lz4_include_cibw/ &&
            export CPATH=$HOME/lz4_include_cibw:$CPATH
          CIBW_REPAIR_WHEEL_COMMAND_MACOS: "delocate-wheel --require-archs {delocate_archs} -w {dest_dir} {wheel}"

      - name: Build Windows wheels
        if: runner.os == 'Windows'
        run: |
          python -m cibuildwheel --output-dir wheelhouse
        working-directory: ./resiliparse_dom
        env:
          CIBW_BUILD: "cp3*"
          CIBW_ARCHS_WINDOWS: "AMD64"
          CIBW_ENVIRONMENT_WINDOWS: >-
            INCLUDE=C:\abseil\install\include;C:\re2\install\include;C:\lexbor\include;C:\vcpkg\installed\x64-windows\include;%INCLUDE%
            LIB=C:\abseil\install\lib;C:\re2\install\lib;C:\lexbor\lib;C:\vcpkg\installed\x64-windows\lib;%LIB%
            PATH=C:\vcpkg\installed\x64-windows\bin;%PATH%
          CIBW_BEFORE_BUILD_WINDOWS: >-
            set PYTHONPATH=
          CIBW_REPAIR_WHEEL_COMMAND_WINDOWS: "pip install delvewheel && delvewheel repair -w {dest_dir} {wheel}"

      - uses: actions/upload-artifact@v4
        with:
          name: resiliparse-dom-wheels-${{ matrix.os }}
          path: resiliparse_dom/wheelhouse/*.whl

  # Then build fastwarc with resiliparse_inc headers available
  build-fastwarc:
    needs: build-resiliparse-dom
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # Setup QEMU for Linux builds with non-x86_64 architecture
      - name: Set up QEMU
        if: runner.os == 'Linux'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      # Cache Vcpkg for Windows
      - name: Cache vcpkg
        if: runner.os == 'Windows'
        uses: actions/cache@v3
        with:
          path: C:/vcpkg
          key: ${{ runner.os }}-vcpkg-${{ hashFiles('**/vcpkg.json') }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-

      # Build custom Docker container for Linux with our exact requirements
      - name: Build custom manylinux Docker container
        if: runner.os == 'Linux'
        run: |
          docker build -t manylinux-resiliparse:latest --build-arg TARGET_ARCH=x86_64 .
          
      # Install system dependencies for macOS
      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew install lz4 zlib pkg-config
          
          # Find and export LZ4 locations
          export LZ4_INCLUDE=$(brew --prefix lz4)/include
          export LZ4_LIB=$(brew --prefix lz4)/lib
          echo "LZ4 include path: $LZ4_INCLUDE"
          echo "LZ4 library path: $LZ4_LIB"
          
          # Create a local directory for LZ4 headers in the user's home directory
          mkdir -p $HOME/lz4_include
          cp $(brew --prefix lz4)/include/lz4*.h $HOME/lz4_include/
          
          # Explicitly install specific version of Abseil
          git clone https://github.com/abseil/abseil-cpp.git --branch ${{ env.ABSEIL_VERSION }}
          cd abseil-cpp
          mkdir build && cd build
          cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr/local -DCMAKE_POSITION_INDEPENDENT_CODE=ON -DCMAKE_CXX_STANDARD=17 -DBUILD_SHARED_LIBS=OFF ..
          make
          sudo make install
          cd ../..
          
          # Install specific version of RE2
          git clone https://github.com/google/re2.git
          cd re2
          git checkout ${{ env.RE2_VERSION }}
          mkdir build && cd build
          cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr/local -DCMAKE_POSITION_INDEPENDENT_CODE=ON -DCMAKE_CXX_STANDARD=17 -DBUILD_SHARED_LIBS=ON -DRE2_BUILD_TESTING=OFF ..
          make
          sudo make install
          cd ../..
          
          # Install lexbor from source
          git clone https://github.com/lexbor/lexbor.git
          cd lexbor
          mkdir build && cd build
          cmake -DCMAKE_BUILD_TYPE=Release -DLEXBOR_BUILD_SHARED=ON -DLEXBOR_BUILD_STATIC=ON ..
          make
          sudo make install
          cd ../..
          
          # Apply lexbor API compatibility patch for html.pyx
          cat > lexbor_api_patch.sed << 'EOF'
          s/lxb_selectors_t/lxb_css_selectors_t/g
          s/lxb_selectors_create/lxb_css_selectors_create/g
          s/lxb_selectors_init/lxb_css_selectors_init/g
          s/lxb_selectors_destroy/lxb_css_selectors_destroy/g
          s/lxb_selectors_find/lxb_css_selectors_find/g
          s/lxb_selectors_cb_f/lxb_css_selectors_cb_f/g
          EOF
          
          # Apply the patch to the source files
          echo "Applying lexbor API compatibility patch"
          sed -i.bak -f lexbor_api_patch.sed resiliparse_dom/resiliparse_dom/parse/html.pyx
          sed -i.bak -f lexbor_api_patch.sed resiliparse_dom/resiliparse_inc/lexbor.pxd
          
          # Install uchardet
          brew install uchardet
          
          # Create LZ4 directories with sudo and copy headers
          sudo mkdir -p /usr/local/include/lz4
          # Copy LZ4 headers to both locations
          sudo cp -f $(brew --prefix lz4)/include/lz4*.h /usr/local/include/
          sudo cp -f $(brew --prefix lz4)/include/lz4*.h /usr/local/include/lz4/
          
          # Set environment variables for this job
          echo "CPATH=$HOME/lz4_include:$(brew --prefix lz4)/include:$(brew --prefix)/include:/usr/local/include:$CPATH" >> $GITHUB_ENV
          echo "LIBRARY_PATH=$(brew --prefix lz4)/lib:$(brew --prefix)/lib:/usr/local/lib:$LIBRARY_PATH" >> $GITHUB_ENV
          echo "PKG_CONFIG_PATH=$(brew --prefix lz4)/lib/pkgconfig:$(brew --prefix)/lib/pkgconfig:$PKG_CONFIG_PATH" >> $GITHUB_ENV
          echo "LZ4_PREFIX=$(brew --prefix lz4)" >> $GITHUB_ENV

      # Install dependencies for Windows
      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        run: |
          # Use vcpkg to install dependencies including uchardet
          git clone https://github.com/microsoft/vcpkg.git C:\vcpkg
          C:\vcpkg\bootstrap-vcpkg.bat
          C:\vcpkg\vcpkg install lz4:x64-windows zlib:x64-windows uchardet:x64-windows
          
          # Install abseil with correct version
          git clone https://github.com/abseil/abseil-cpp.git C:\abseil --branch ${{ env.ABSEIL_VERSION }}
          cd C:\abseil
          mkdir build
          cd build
          cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=C:\abseil\install -DCMAKE_POSITION_INDEPENDENT_CODE=ON -DCMAKE_CXX_STANDARD=17 -DBUILD_SHARED_LIBS=OFF ..
          cmake --build . --config Release
          cmake --install . --config Release
          
          # Install RE2 with correct version
          git clone https://github.com/google/re2.git C:\re2
          cd C:\re2
          git checkout ${{ env.RE2_VERSION }}
          mkdir build
          cd build
          cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=C:\re2\install -DCMAKE_POSITION_INDEPENDENT_CODE=ON -DCMAKE_CXX_STANDARD=17 -DBUILD_SHARED_LIBS=ON -DRE2_BUILD_TESTING=OFF ..
          cmake --build . --config Release
          cmake --install . --config Release
          
          # Build and install lexbor
          git clone https://github.com/lexbor/lexbor.git C:\lexbor
          cd C:\lexbor
          mkdir build
          cd build
          cmake -DCMAKE_BUILD_TYPE=Release -DLEXBOR_BUILD_SHARED=ON -DLEXBOR_BUILD_STATIC=ON ..
          cmake --build . --config Release
          cmake --install . --config Release
          
          # Make sure the include and library paths are accessible
          echo "Include paths:"
          dir C:\vcpkg\installed\x64-windows\include
          echo "Library paths:"
          dir C:\vcpkg\installed\x64-windows\lib
          echo "Bin paths:"
          dir C:\vcpkg\installed\x64-windows\bin

      # Setup resiliparse_inc header files for fastwarc build
      - name: Setup resiliparse headers
        run: |
          # Copy resiliparse_inc directory to fastwarc
          mkdir -p fastwarc/resiliparse_inc
          cp -r resiliparse_dom/resiliparse_inc/* fastwarc/resiliparse_inc/ || echo "Failed to copy headers"
          find resiliparse_dom -name "resiliparse_inc" -type d
        shell: bash

      - name: Install cibuildwheel
        run: python -m pip install cibuildwheel

      - name: Download resiliparse_dom wheels
        uses: actions/download-artifact@v4
        with:
          name: resiliparse-dom-wheels-${{ matrix.os }}
          path: ./resiliparse_dom_wheels

      - name: Build Linux wheels
        if: runner.os == 'Linux'
        run: |
          # Debug information about the Docker image
          docker run --rm manylinux-resiliparse:latest find /usr -name "re2.h" || echo "re2.h not found"
          docker run --rm manylinux-resiliparse:latest find /usr -name "libabsl*" || echo "libabsl not found"
          docker run --rm manylinux-resiliparse:latest find /usr -name "liblexbor*" || echo "liblexbor not found"
          
          # Run cibuildwheel with additional debugging environment
          CIBW_ENVIRONMENT_LINUX="CPATH=/usr/include:/usr/local/include:${CPATH} LIBRARY_PATH=/usr/lib64:/usr/lib:/usr/local/lib64:/usr/local/lib:${LIBRARY_PATH} PKG_CONFIG_PATH=/usr/lib64/pkgconfig:/usr/lib/pkgconfig:/usr/local/lib64/pkgconfig:/usr/local/lib/pkgconfig:${PKG_CONFIG_PATH} PYTHONDONTWRITEBYTECODE=1" \
          python -m cibuildwheel --output-dir wheelhouse
        working-directory: ./fastwarc
        env:
          CIBW_BUILD: "cp3*"
          CIBW_ARCHS_LINUX: "x86_64"
          # Use the custom Docker container we built
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux-resiliparse:latest
          CIBW_BEFORE_ALL_LINUX: |
            # Make sure the linker can find all libraries
            ldconfig
            # Show available libraries
            echo "Installed libraries:"
            ldconfig -p | grep -E 're2|absl|lexbor|uchardet|lz4'
            
            # Create debug links in case paths are incorrect
            mkdir -p /usr/include/re2
            find /usr -name "re2.h" -exec cp -f {} /usr/include/re2/ \;
            
            # Debug information to check paths
            echo "Path environment:"
            echo "CPATH=$CPATH"
            echo "LIBRARY_PATH=$LIBRARY_PATH"
            echo "Contents of /usr/include directory:"
            ls -la /usr/include
            echo "Contents of /usr/local/include directory:"
            ls -la /usr/local/include 2>/dev/null || echo "Directory not found"
            
            # Copy resiliparse_inc headers into the container
            mkdir -p /project/resiliparse_inc
            cp -r /host/project/resiliparse_inc/* /project/resiliparse_inc/ || echo "Failed to copy headers, checking path" && ls -la /host/

      - name: Build macOS wheels
        if: runner.os == 'macOS'
        run: |
          pip install delocate
          
          # Print environment for debugging
          echo "CPATH: $CPATH"
          echo "LIBRARY_PATH: $LIBRARY_PATH"
          echo "PKG_CONFIG_PATH: $PKG_CONFIG_PATH"
          echo "LZ4_PREFIX: $LZ4_PREFIX"
          
          # Find LZ4 installation
          echo "LZ4 include directory contents:"
          ls -la "$LZ4_PREFIX/include"
          echo "LZ4 lib directory contents:"
          ls -la "$LZ4_PREFIX/lib"
          echo "Home directory LZ4 include contents:"
          ls -la "$HOME/lz4_include"
          
          # Print the contents of /usr/local/include to verify our headers
          echo "Contents of /usr/local/include:"
          ls -la /usr/local/include | grep lz4
          echo "Contents of /usr/local/include/lz4:"
          ls -la /usr/local/include/lz4 || echo "Directory not found"
          
          python -m cibuildwheel --output-dir wheelhouse
        working-directory: ./fastwarc
        env:
          CIBW_BUILD: "cp3*"
          CIBW_ARCHS_MACOS: "x86_64 arm64"
          CIBW_ENVIRONMENT_MACOS: >-
            CPATH=$HOME/lz4_include:$LZ4_PREFIX/include:/usr/local/include:$CPATH
            LIBRARY_PATH=$LZ4_PREFIX/lib:/usr/local/lib:$LIBRARY_PATH
            PKG_CONFIG_PATH=$LZ4_PREFIX/lib/pkgconfig:$PKG_CONFIG_PATH
            MACOSX_DEPLOYMENT_TARGET=${{ env.MACOSX_DEPLOYMENT_TARGET }}
            LZ4_PREFIX=$LZ4_PREFIX
            HOME=$HOME
          CIBW_BEFORE_BUILD_MACOS: >-
            brew install pkg-config &&
            mkdir -p $HOME/lz4_include_cibw &&
            cp -f $LZ4_PREFIX/include/lz4*.h $HOME/lz4_include_cibw/ &&
            export CPATH=$HOME/lz4_include_cibw:$CPATH
          CIBW_REPAIR_WHEEL_COMMAND_MACOS: "delocate-wheel --require-archs {delocate_archs} -w {dest_dir} {wheel}"

      - name: Build Windows wheels
        if: runner.os == 'Windows'
        run: |
          python -m cibuildwheel --output-dir wheelhouse
        working-directory: ./fastwarc
        env:
          CIBW_BUILD: "cp3*"
          CIBW_ARCHS_WINDOWS: "AMD64"
          CIBW_ENVIRONMENT_WINDOWS: >-
            INCLUDE=C:\abseil\install\include;C:\re2\install\include;C:\lexbor\include;C:\vcpkg\installed\x64-windows\include;%INCLUDE%
            LIB=C:\abseil\install\lib;C:\re2\install\lib;C:\lexbor\lib;C:\vcpkg\installed\x64-windows\lib;%LIB%
            PATH=C:\vcpkg\installed\x64-windows\bin;%PATH%
          CIBW_BEFORE_BUILD_WINDOWS: >-
            set PYTHONPATH=
          CIBW_REPAIR_WHEEL_COMMAND_WINDOWS: "pip install delvewheel && delvewheel repair -w {dest_dir} {wheel}"

      - uses: actions/upload-artifact@v4
        with:
          name: fastwarc-wheels-${{ matrix.os }}
          path: fastwarc/wheelhouse/*.whl

  release:
    needs: [build-fastwarc, build-resiliparse-dom]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    
    permissions:
      contents: write  # Required for creating GitHub releases
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Display structure of downloaded artifacts
        run: find dist -type f | sort

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/**/*.whl
          draft: false
          generate_release_notes: true
